<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-pending" data-theme="light">
  <div id="login" class="login-shell">
    <section class="login-card">
      <div class="login-mark">EP</div>
      <h1>Acesso</h1>
      <p>Entre para gerenciar sua operação.</p>
      <input id="token" type="password" placeholder="Senha" autocomplete="current-password">
      <button id="saveToken" type="button">Entrar</button>
      <span id="loginError" class="login-error hidden">Acesso negado</span>
    </section>
  </div>

  <div id="app" class="admin-layout hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-icon">EP</div>
        <div>
          <strong>Elly Admin</strong>
          <small>Checkout Suite</small>
        </div>
      </div>
      <nav id="sideNav"></nav>
      <button class="sidebar-footer" id="logoutButton" type="button">Sair</button>
    </aside>

    <section class="workspace">
      <header class="topbar-admin">
        <button class="icon-button mobile-only" id="menuButton" type="button">☰</button>
        <div class="breadcrumbs" id="breadcrumbs">Painel / Dashboard</div>
        <div class="global-search">
          <span>⌕</span>
          <input id="globalSearch" placeholder="Buscar pedidos, clientes, produtos...">
        </div>
        <button class="chip" id="themeToggle" type="button">Modo escuro</button>
        <button class="primary-action" id="quickSave" type="button">Salvar</button>
      </header>

      <main class="content">
        <div id="viewHeader" class="view-header"></div>
        <div id="viewRoot" class="view-root"></div>
      </main>
    </section>
  </div>

  <div id="modalRoot" class="modal-root hidden"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script src="admin.js"></script>
</body>
</html>
